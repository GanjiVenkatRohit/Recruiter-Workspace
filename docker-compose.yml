version: '3.9'
services:

  postgres:
    image: postgres:16-alpine
    container_name: rw-postgres
    environment:
      POSTGRES_DB: recruiter_workspace
      POSTGRES_USER: rw_user
      POSTGRES_PASSWORD: rw_password
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rw_user -d recruiter_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rw-redis
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    container_name: rw-server
    ports: ["3000:3000"]
    env_file: ./server/.env
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  upload-orchestrator:
    build: ./pipeline/upload-orchestrator
    container_name: rw-upload-orchestrator
    ports: ["3001:3001"]
    env_file: ./pipeline/upload-orchestrator/.env
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  processor:
    build: ./pipeline/processor
    container_name: rw-processor
    ports: ["3002:3002"]
    env_file: ./pipeline/processor/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  search-service:
    build: ./pipeline/search-service
    container_name: rw-search-service
    ports: ["3003:3003"]
    env_file: ./pipeline/search-service/.env
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  event-system:
    build: ./pipeline/event-system
    container_name: rw-event-system
    ports: ["3004:3004"]
    env_file: ./pipeline/event-system/.env
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: rw-nginx
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - upload-orchestrator
      - search-service
      - event-system
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
