events { worker_connections 1024; }

http {
  upstream server_upstream        { server rw-server:3000; }
  upstream orchestrator_upstream  { server rw-upload-orchestrator:3001; }
  upstream search_upstream        { server rw-search-service:3003; }
  upstream events_upstream        { server rw-event-system:3004; }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://server_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Correlation-ID $request_id;
    }

    location /ws {
      proxy_pass http://server_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /orchestrator/ {
      proxy_pass http://orchestrator_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /search/ {
      proxy_pass http://search_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /events/ {
      proxy_pass http://events_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
    }

    location / {
      proxy_pass http://server_upstream;
      proxy_set_header Host $host;
    }
  }
}
